name: Deploy web (GitHub Pages)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 16 (legacy CRA toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build
        env:
          CI: 'false'
          PUBLIC_URL: /PB-flip
        run: npm run build

      - name: Rewrite hardcoded absolute asset paths to /PB-flip prefix
        run: |
          set -eux
          # CRA's PUBLIC_URL only rewrites paths referenced via process.env.PUBLIC_URL.
          # Source code uses raw absolute strings like "/models/foo.glb" which break on a project Pages site.
          # Rewrite them in the built JS/CSS bundles.
          find build/static -type f \( -name '*.js' -o -name '*.css' \) -print0 | xargs -0 sed -i \
            -e 's|"/models/|"/PB-flip/models/|g' \
            -e "s|'/models/|'/PB-flip/models/|g" \
            -e 's|"/images/|"/PB-flip/images/|g' \
            -e "s|'/images/|'/PB-flip/images/|g" \
            -e 's|"/dna/|"/PB-flip/dna/|g' \
            -e "s|'/dna/|'/PB-flip/dna/|g" \
            -e 's|"/sauce-label.png"|"/PB-flip/sauce-label.png"|g' \
            -e "s|'/sauce-label.png'|'/PB-flip/sauce-label.png'|g"
          # Sanity: confirm rewrites landed
          grep -c '/PB-flip/models/' build/static/js/main.*.js || true

      - name: Add SPA fallback (404.html)
        run: cp build/index.html build/404.html

      - name: Disable Jekyll
        run: touch build/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          force_orphan: true
