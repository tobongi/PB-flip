name: Deploy web (GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - 'build/**'
      - 'public/_headers'
      - 'public/_redirects'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage build/ for Pages (no rebuild — use committed bundle)
        run: |
          set -eux
          mkdir -p out
          cp -R build/. out/

      - name: Rewrite hardcoded absolute asset paths to /PB-flip subpath
        # The committed bundle uses absolute paths like "/models/foo.glb" because Vercel serves at root.
        # GitHub Pages serves under /PB-flip, so prefix all root-relative asset paths.
        run: |
          set -eux
          find out/static -type f \( -name '*.js' -o -name '*.css' \) -print0 | xargs -0 sed -i \
            -e 's|"/models/|"/PB-flip/models/|g' \
            -e "s|'/models/|'/PB-flip/models/|g" \
            -e 's|"/images/|"/PB-flip/images/|g' \
            -e "s|'/images/|'/PB-flip/images/|g" \
            -e 's|"/dna/|"/PB-flip/dna/|g' \
            -e "s|'/dna/|'/PB-flip/dna/|g" \
            -e 's|"/sauce-label.png"|"/PB-flip/sauce-label.png"|g' \
            -e "s|'/sauce-label.png'|'/PB-flip/sauce-label.png'|g"
          # Index assets at /static/ already include the homepage prefix from the build; no rewrite needed.
          grep -c '/PB-flip/models/' out/static/js/main.*.js || true

      - name: Add SPA fallback (404.html)
        run: cp out/index.html out/404.html

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
