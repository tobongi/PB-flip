name: Deploy web (GitHub Pages)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # webpack 3 uses a deprecated OpenSSL hash (md4) removed in Node 17+
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - run: npm ci

      - name: Build
        # package.json "homepage" already sets PUBLIC_URL=/PB-flip so all
        # asset paths come out prefixed correctly — no sed rewriting needed.
        run: npm run build

      - name: SPA fallback + Jekyll disable
        run: |
          cp build/index.html build/404.html
          touch build/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          force_orphan: true
