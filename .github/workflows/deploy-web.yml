name: Deploy web (GitHub Pages)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # webpack 3 uses a deprecated OpenSSL hash (md4) removed in Node 17+
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Rewrite hardcoded root-relative asset paths to /PB-flip subpath
        # package.json "homepage" prefixes webpack chunk paths but NOT hardcoded
        # string literals in JS (e.g. '/models/foo.glb', '/images/bar.webp').
        # Rewrite them so GitHub Pages (/PB-flip) can resolve them.
        run: |
          find build/static -type f \( -name '*.js' -o -name '*.css' \) -print0 | xargs -0 sed -i \
            -e 's|"/models/|"/PB-flip/models/|g' \
            -e "s|'/models/|'/PB-flip/models/|g" \
            -e 's|"/images/|"/PB-flip/images/|g' \
            -e "s|'/images/|'/PB-flip/images/|g" \
            -e 's|"/dna/|"/PB-flip/dna/|g' \
            -e "s|'/dna/|'/PB-flip/dna/|g" \
            -e 's|"/sauce-label.png"|"/PB-flip/sauce-label.png"|g' \
            -e "s|'/sauce-label.png'|'/PB-flip/sauce-label.png'|g"

      - name: SPA fallback + Jekyll disable
        run: |
          cp build/index.html build/404.html
          touch build/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          force_orphan: true
