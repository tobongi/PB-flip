name: Build Android APK (Capacitor)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 16 for CRA build
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install web deps + build bundle (relative paths for APK)
        env:
          CI: 'false'
          PUBLIC_URL: '.'
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Switch to Node 20 for Capacitor 6
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor toolchain
        run: |
          npm install --no-save --legacy-peer-deps \
            @capacitor/core@^6.1.2 \
            @capacitor/cli@^6.1.2 \
            @capacitor/android@^6.1.2 \
            @capacitor/splash-screen@^6.0.2 \
            @capacitor/status-bar@^6.0.2

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bottle-flip-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
